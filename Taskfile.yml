version: '3'

tasks:
  fmt:
    cmds:
      - cargo fmt --all

  fmt-check:
    cmds:
      - cargo fmt --all -- --check

  clippy:
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    cmds:
      - cargo test --workspace --locked

  doc:
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  aep-check:
    cmds:
      - aep plan artifact validate

  web-check:
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm web:check

  release-action-check:
    cmds:
      - test -x .github/actions/release-component/release.sh
      - bash -n .github/actions/release-component/release.sh
      - grep -q 'generate release bundle' .github/actions/release-component/release.sh
      - grep -q 'cosign sign' .github/actions/release-component/release.sh
      - "! grep -R -n -E 'ghcr\\.io|beyond10x/(workflow|todo|aep-service)' .github/actions/release-component"

  check:
    deps: [fmt-check, clippy, test, doc, aep-check, web-check, release-action-check]

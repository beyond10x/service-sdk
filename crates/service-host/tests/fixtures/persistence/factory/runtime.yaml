format: service-definition/3
service: persistence_factory
delivery: { kind: composed_connector }
realm: optional
content:
  - name: body
    reference_type: persistence_factory.document.ContentRef
    media_types: [text/plain]
    max_bytes: 4096
    custody: external_erasable
obligations:
  - name: aggregate
    provider: sdk.aggregate.event-sourced/v1
    bindings: { aggregate: persistence_factory.document.Document, identity: id }
    description: Guard one document stream.
  - name: requested
    provider: sdk.auth.requested-scopes/v1
    bindings: { scopes: scopes }
    description: Recheck the requested team.
  - name: owner
    provider: sdk.auth.owner-and-conjunctive-scopes/v1
    bindings: { owner: persistence_factory.document.Document.owner, scopes: persistence_factory.document.Document.scopes }
    description: Require current owner and team.
  - name: open
    provider: sdk.lifecycle.require-state/v1
    bindings: { entity: persistence_factory.document.Document, allowed: Open }
    description: Only open documents accept new mutations.
  - name: content
    provider: sdk.content.external-erasable/v1
    bindings: { content: body }
    description: Retain content separately from events.
  - name: visibility
    provider: sdk.projection.auth-partitioned-visibility/v1
    bindings: { owner: owner, scopes: scopes }
    description: Filter by verified owner and team.
projections:
  - name: documents
    view: persistence_factory.document.ById
    delivery: inline_transactional
    obligations: [visibility]
intents:
  - name: create
    scope: documents.manage
    command: persistence_factory.document.Create
    stream_id: { kind: generated_uuid_v7 }
    expected_version: { kind: no_stream }
    idempotency: { kind: operation_field, field: key }
    content:
      - { content: body, input_field: content, command_reference_field: content_ref }
    event_bindings:
      - { event: persistence_factory.document.Created, field: id, source: { kind: stream_id } }
      - { event: persistence_factory.document.Created, field: revision, source: { kind: generated_uuid_v7 } }
      - { event: persistence_factory.document.Created, field: owner, source: { kind: context, value: current_authority } }
    projections: [documents]
    obligations: [aggregate, requested, content]
  - name: revise
    scope: documents.manage
    command: persistence_factory.document.Revise
    stream_id: { kind: command_field, field: id }
    expected_version: { kind: operation_field, field: version }
    idempotency: { kind: operation_field, field: key }
    event_bindings:
      - { event: persistence_factory.document.Revised, field: revision, source: { kind: generated_uuid_v7 } }
    projections: [documents]
    obligations: [aggregate, owner, open]
  - name: close
    scope: documents.manage
    command: persistence_factory.document.Close
    stream_id: { kind: command_field, field: id }
    expected_version: { kind: operation_field, field: version }
    idempotency: { kind: operation_field, field: key }
    event_bindings:
      - { event: persistence_factory.document.Closed, field: revision, source: { kind: generated_uuid_v7 } }
    projections: [documents]
    obligations: [aggregate, owner, open]
queries:
  - name: list
    scope: documents.read
    view: persistence_factory.document.ById
    projection: documents
    sort: [{ view_field: id, direction: ascending }]
    delivery: read_your_writes
    obligations: [visibility]
  - name: get
    scope: documents.read
    view: persistence_factory.document.ById
    projection: documents
    selectors: [{ parameter: id, view_field: id }]
    sort: [{ view_field: id, direction: ascending }]
    delivery: read_your_writes
    obligations: [visibility]

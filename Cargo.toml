[workspace]
resolver = "2"
members = [
    "crates/service-builder",
    "crates/service-catalog",
    "crates/service-conformance",
    "crates/service-connectors",
    "crates/service-definition",
    "crates/service-engine",
    "crates/service-eventlog",
    "crates/service-http",
    "crates/service-host",
    "crates/service-obligations",
    "crates/service-runtime",
    "crates/service-runtime-ir",
    "crates/service-host/tests/fixtures/persistence/standalone/generated/rust",
    "crates/service-host/tests/fixtures/persistence/factory/generated/rust",
]

[workspace.package]
version = "0.5.11"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/service-sdk"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7"] }

identity-client = { git = "https://github.com/beyond10x/identity.git", rev = "7f22a5359fc5786fd26ab0f0bd728b8544b11950" }

# The organization persistence kit is the only generated-service event/projection/blob backend.
eventlog-core = { git = "https://github.com/beyond10x/eventlog.git", rev = "081815cdfcbf1c751e7ee91abd81af2ff7d460cb" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog.git", rev = "081815cdfcbf1c751e7ee91abd81af2ff7d460cb" }
eventlog-postgres = { git = "https://github.com/beyond10x/eventlog.git", rev = "081815cdfcbf1c751e7ee91abd81af2ff7d460cb" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Exact compiler/synthesis ownership boundary used by service-runtime-ir/3.
ess-compiler = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }
ess-deployment = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }
ess-domain = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }
ess-gen = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }
ess-realization = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }
ess-synth = { git = "https://github.com/beyond10x/ess.git", rev = "95ef5be70dbce966056d0484b66db7ed836fa406" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Generated SDK proof packages retain their published source lock. Only this
# workspace fixture build substitutes the candidate under test, never a sibling.
[patch."https://github.com/beyond10x/service-sdk.git"]
service-engine = { path = "crates/service-engine" }
service-connectors = { path = "crates/service-connectors" }
service-catalog = { path = "crates/service-catalog" }
service-http = { path = "crates/service-http" }
service-host = { path = "crates/service-host" }

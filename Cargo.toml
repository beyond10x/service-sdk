[workspace]
resolver = "2"
members = [
    "crates/service-builder",
    "crates/service-catalog",
    "crates/service-conformance",
    "crates/service-connectors",
    "crates/service-definition",
    "crates/service-engine",
    "crates/service-eventlog",
    "crates/service-obligations",
    "crates/service-runtime",
    "crates/service-runtime-ir",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/service-sdk"
authors = ["Beyond10x contributors"]
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7"] }

# The organization persistence kit is the only generated-service event/projection/blob backend.
eventlog-core = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog.git", rev = "b7e8f0d87b01c403415546d311952cb155caf16f" }

# Exact compiler/synthesis ownership boundary used by service-runtime-ir/2.
ess-compiler = { git = "https://github.com/beyond10x/ess.git", rev = "01f12c9d66cc8c4cb400ba786c1dcf268e0f752d" }
ess-domain = { git = "https://github.com/beyond10x/ess.git", rev = "01f12c9d66cc8c4cb400ba786c1dcf268e0f752d" }
ess-gen = { git = "https://github.com/beyond10x/ess.git", rev = "01f12c9d66cc8c4cb400ba786c1dcf268e0f752d" }
ess-synth = { git = "https://github.com/beyond10x/ess.git", rev = "01f12c9d66cc8c4cb400ba786c1dcf268e0f752d" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
